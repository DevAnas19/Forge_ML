services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: forgeml
      POSTGRES_PASSWORD: forgeml123
      POSTGRES_DB: forgeml_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeml -d forgeml_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://forgeml:forgeml123@postgres:5432/forgeml_db
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      INTERNAL_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: